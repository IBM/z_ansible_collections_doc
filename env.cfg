# Set the the directory where the Python virtual environment will be created.
# Default will be `pwd`.
PYTHON_VENV_HOME=""

# This is the absolute pytyhon executable path, for example 'PYTHON_EXE_PATH="/opt/homebrew/bin/python3.14"'
# If unset, the script will auto detect pythons and set it to lateest version
PYTHON_EXE_PATH=""

# The minimum version of Python required (major.minor); later versions are accepted.
# Sphinx 9.x, pinned in requirements.txt, requires Python 3.13 or later.
# This is a minimum, not the version used everywhere: the container image
# (container/Containerfile) installs Python 3.14 because the UBI 9 repositories
# do not offer 3.13. If Sphinx raises its minimum Python, update this value.
PYTHON_VERSION_SUPPORTED="3.13"